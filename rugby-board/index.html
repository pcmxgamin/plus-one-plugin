<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>North Coast Sharks Rugby Board</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#07111e;color:#fff;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;overscroll-behavior:none}
body{min-height:100dvh}.app{max-width:620px;margin:auto;min-height:100dvh;background:#081827}
header{padding:10px 12px 8px;display:flex;align-items:center;justify-content:space-between;gap:8px}.brand{font-weight:900;font-size:15px}.brand small{display:block;font-size:9px;opacity:.58;letter-spacing:.08em;margin-top:2px}.badge{font-size:10px;padding:5px 8px;border:1px solid #385069;border-radius:999px}
.toolbar{display:flex;gap:6px;overflow-x:auto;padding:7px 10px;background:#0d243a;scrollbar-width:none}.toolbar::-webkit-scrollbar{display:none}
button{border:1px solid #36516d;background:#112d49;color:#fff;border-radius:9px;padding:8px 10px;font-weight:750;font-size:11px;white-space:nowrap}button.primary{background:#f2cf25;color:#081827;border-color:#f2cf25}
.stage{padding:7px;display:flex;justify-content:center}.pitch{position:relative;width:min(96vw,500px);height:min(142vw,735px);max-height:74dvh;background:#26784d;border:2px solid #f7f7f7;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;overscroll-behavior:contain}
.pitch:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0,transparent 9.8%,rgba(255,255,255,.08) 10%);pointer-events:none}
.fieldline{position:absolute;left:0;width:100%;height:1px;background:#ffffffaa}.dash{position:absolute;top:0;height:100%;border-left:1px dashed #ffffff88}.attack{position:absolute;top:5px;left:0;right:0;text-align:center;font-size:9px;font-weight:900;letter-spacing:.18em;opacity:.75}
.grab{position:absolute;width:48px;height:48px;margin:-24px;display:grid;place-items:center;touch-action:none;z-index:5}.dot{width:23px;height:23px;border-radius:50%;background:#f4d421;color:#09213a;border:1.5px solid white;display:grid;place-items:center;font-size:9px;font-weight:950;box-shadow:0 2px 5px #0008;pointer-events:none}.grab.sel .dot{outline:3px solid #fff9}
.ballgrab{position:absolute;width:48px;height:48px;margin:-24px;display:grid;place-items:center;touch-action:none;z-index:8}.ball{width:19px;height:11px;border-radius:50%;background:#efe0c4;border:1.5px solid #4b3627;transform:rotate(-20deg);pointer-events:none}
.ruck{position:absolute;width:54px;height:30px;margin:-15px -27px;border:1.5px dashed white;border-radius:50%;background:#7d276a88;display:grid;place-items:center;font-size:8px;font-weight:900;z-index:2;touch-action:none}
.bottom{background:#0d243a;border-top:1px solid #29435d}.phases{display:flex;gap:6px;overflow-x:auto;padding:8px 10px}.phase{min-width:84px;text-align:left;padding:7px}.phase.on{border-color:#f2cf25;color:#f2cf25}.phase span{display:block;font-size:8px;opacity:.6;margin-top:2px}
.command{display:flex;gap:6px;padding:0 10px 8px}.command input{min-width:0;flex:1;background:#071827;border:1px solid #38516b;border-radius:9px;color:white;padding:10px;font-size:12px}.status{padding:0 11px 9px;color:#f2cf25;font-size:10px;min-height:21px}.help{padding:0 11px 10px;font-size:9px;opacity:.6;line-height:1.45}
body.record header,body.record .toolbar,body.record .bottom{display:none}body.record .stage{padding:0}.record .pitch{width:100vw;height:100dvh;max-height:none;border:0}
</style></head><body><main class="app"><header><div class="brand">NORTH COAST SHARKS<small>PRIVATE RUGBY ANIMATION BOARD</small></div><div class="badge">Pattern 1 · Scrum</div></header>
<div class="toolbar"><button class="primary" id="play">▶ PLAY</button><button id="save">＋ PHASE</button><button id="ruck">＋ RUCK</button><button id="pod">△ POD</button><button id="undo">↶ UNDO</button><button id="reset">RESET</button><button id="record">▣ RECORD VIEW</button></div>
<section class="stage"><div class="pitch" id="pitch"><div class="attack">↑ ATTACK</div><div class="fieldline" style="top:10%"></div><div class="fieldline" style="top:25%"></div><div class="fieldline" style="top:50%"></div><div class="fieldline" style="top:75%"></div><div class="fieldline" style="top:90%"></div><div class="dash" style="left:12%"></div><div class="dash" style="right:12%"></div></div></section>
<section class="bottom"><div class="phases" id="phases"></div><div class="command"><input id="cmd" placeholder="Say or type: move 10 wider…"><button id="mic">🎙 VOICE</button><button id="do">DO</button></div><div class="status" id="status">Drag a player anywhere inside the pitch.</div><div class="help">Try: “move 10 wider”, “move 9 behind the ruck”, “select 5 2 4”, “make a pod”, “save phase R1”, “play”, “undo”. Tap three players then POD to create a triangle.</div></section></main>
<script>
(()=>{const pitch=document.querySelector('#pitch'),status=document.querySelector('#status'),phasebar=document.querySelector('#phases'),cmd=document.querySelector('#cmd');
const start={1:[10,54],2:[14,54],3:[18,54],4:[11,58],5:[15,58],6:[19,58],7:[12,62],8:[16,66],9:[31,78],10:[27,68],11:[40,88],12:[45,73],13:[62,86],14:[84,86],15:[73,92]};
const wide={1:[12,18],2:[16,17],3:[20,16],4:[31,25],5:[38,22],6:[46,28],7:[54,19],8:[59,25],9:[76,14],10:[69,28],11:[8,34],12:[47,37],13:[70,34],14:[88,27],15:[80,18]};
let players={},ball,rucks=[],phases=[],history=[],selected=new Set(),playing=false;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));function pos(el,x,y){el.style.left=x+'%';el.style.top=y+'%';el.dataset.x=x;el.dataset.y=y}
function mkPlayer(n){let g=document.createElement('div');g.className='grab';g.dataset.n=n;g.innerHTML='<div class="dot">'+n+'</div>';pitch.appendChild(g);players[n]=g;pos(g,...start[n]);makeDrag(g);g.addEventListener('click',()=>{if(g.dataset.dragged==='1'){g.dataset.dragged='0';return}selected.has(n)?selected.delete(n):selected.add(n);paint()})}
Object.keys(start).forEach(n=>mkPlayer(+n));let bg=document.createElement('div');bg.className='ballgrab';bg.innerHTML='<div class="ball"></div>';pitch.appendChild(bg);ball=bg;pos(ball,...start[8]);makeDrag(ball);
function paint(){Object.entries(players).forEach(([n,e])=>e.classList.toggle('sel',selected.has(+n)))}
function snapshot(name){let p={};Object.entries(players).forEach(([n,e])=>p[n]=[+e.dataset.x,+e.dataset.y]);return{name:name||'',p,ball:[+ball.dataset.x,+ball.dataset.y],rucks:rucks.map(r=>[+r.dataset.x,+r.dataset.y,r.textContent])}}
function remember(){history.push(snapshot());if(history.length>40)history.shift()}
function restore(s){Object.entries(s.p).forEach(([n,v])=>pos(players[n],v[0],v[1]));pos(ball,s.ball[0],s.ball[1]);rucks.forEach(r=>r.remove());rucks=[];(s.rucks||[]).forEach(v=>addRuck(v[0],v[1],v[2]))}
function makeDrag(el){let active=false,sx=0,sy=0;el.addEventListener('pointerdown',e=>{if(playing)return;active=true;sx=e.clientX;sy=e.clientY;el.dataset.dragged='0';remember();el.setPointerCapture(e.pointerId);e.preventDefault()},{passive:false});el.addEventListener('pointermove',e=>{if(!active)return;let r=pitch.getBoundingClientRect();pos(el,clamp((e.clientX-r.left)/r.width*100,2,98),clamp((e.clientY-r.top)/r.height*100,2,98));if(Math.hypot(e.clientX-sx,e.clientY-sy)>5)el.dataset.dragged='1';e.preventDefault()},{passive:false});el.addEventListener('pointerup',e=>{active=false;e.preventDefault()},{passive:false})}
function addRuck(x=50,y=45,label='R'+(rucks.length+1)){let r=document.createElement('div');r.className='ruck';r.textContent=label;pitch.appendChild(r);pos(r,x,y);makeDrag(r);rucks.push(r);return r}
function savePhase(name){let s=snapshot(name||'Phase '+(phases.length+1));phases.push(s);render();status.textContent='Saved '+s.name}
function render(){phasebar.innerHTML='';phases.forEach((s,i)=>{let b=document.createElement('button');b.className='phase'+(i===phases.length-1?' on':'');b.innerHTML=s.name+'<span>tap to edit</span>';b.onclick=()=>{restore(s);[...phasebar.children].forEach(x=>x.classList.remove('on'));b.classList.add('on')};phasebar.appendChild(b)})}
const lerp=(a,b,t)=>a+(b-a)*t;async function animate(){if(phases.length<2){status.textContent='Save a second phase first.';return}playing=true;for(let i=0;i<phases.length-1&&playing;i++){let a=phases[i],b=phases[i+1],t0=performance.now();await new Promise(done=>{function f(now){let q=Math.min(1,(now-t0)/1200),t=q*q*(3-2*q);Object.keys(a.p).forEach(n=>pos(players[n],lerp(a.p[n][0],b.p[n][0],t),lerp(a.p[n][1],b.p[n][1],t)));pos(ball,lerp(a.ball[0],b.ball[0],t),lerp(a.ball[1],b.ball[1],t));q<1&&playing?requestAnimationFrame(f):done()}requestAnimationFrame(f)})}playing=false;status.textContent='Finished'}
function pod(){let a=[...selected];if(a.length!==3){status.textContent='Select exactly three players.';return}remember();let c=players[a[0]],x=+c.dataset.x,y=+c.dataset.y;pos(c,x,y-3);pos(players[a[1]],x-4.5,y+2);pos(players[a[2]],x+4.5,y+2);status.textContent=a[0]+' carrier; '+a[1]+' and '+a[2]+' support.'}
function run(text){let s=text.toLowerCase().trim();status.textContent='“'+text+'”';if(/^(play|animate)/.test(s))return animate();if(s.includes('undo'))return undo();if(s.includes('reset'))return reset();if(s.includes('pod')||s.includes('triangle'))return pod();let m=s.match(/save(?: phase)?(?: as)?\s*(.*)/);if(m)return savePhase(m[1]||undefined);m=s.match(/select\s+([\d ,]+)/);if(m){selected.clear();(m[1].match(/\d+/g)||[]).forEach(n=>players[n]&&selected.add(+n));paint();return}m=s.match(/move (?:player )?(\d+)\s+(wider|left|right|forward|up|back|deeper)(?:\s+(\d+))?/);if(m&&players[m[1]]){remember();let e=players[m[1]],x=+e.dataset.x,y=+e.dataset.y,d=+(m[3]||7);if(m[2]==='wider'||m[2]==='right')x+=d;if(m[2]==='left')x-=d;if(m[2]==='forward'||m[2]==='up')y-=d;if(m[2]==='back'||m[2]==='deeper')y+=d;pos(e,clamp(x,2,98),clamp(y,2,98));return}m=s.match(/move (?:player )?9 .*behind.*ruck/);if(m&&rucks.length){let r=rucks.at(-1);pos(players[9],+r.dataset.x,+r.dataset.y+5);return}status.textContent='I did not recognise that command yet. You can drag the player instead.'}
function undo(){if(history.length)restore(history.pop())}function reset(){playing=false;Object.entries(start).forEach(([n,v])=>pos(players[n],...v));pos(ball,...start[8]);rucks.forEach(r=>r.remove());rucks=[];selected.clear();paint();status.textContent='Starting scrum shape restored.'}
document.querySelector('#play').onclick=animate;document.querySelector('#save').onclick=()=>savePhase();document.querySelector('#ruck').onclick=()=>{remember();addRuck();status.textContent='Ruck added — drag it anywhere.'};document.querySelector('#pod').onclick=pod;document.querySelector('#undo').onclick=undo;document.querySelector('#reset').onclick=reset;document.querySelector('#record').onclick=()=>document.body.classList.toggle('record');document.querySelector('#do').onclick=()=>run(cmd.value);cmd.onkeydown=e=>{if(e.key==='Enter')run(cmd.value)};
document.querySelector('#mic').onclick=()=>{let SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){status.textContent='This browser does not expose speech recognition. Type the command instead.';return}let r=new SR();r.lang='en-AU';r.interimResults=false;status.textContent='Listening…';r.onresult=e=>{cmd.value=e.results[0][0].transcript;run(cmd.value)};r.onerror=()=>status.textContent='Microphone unavailable. Check browser microphone permission.';r.start()};
savePhase('START');let original=snapshot();Object.entries(wide).forEach(([n,v])=>pos(players[n],...v));pos(ball,...wide[9]);addRuck(91,10,'R1');savePhase('WIDE SHAPE');restore(original);phasebar.firstChild?.classList.add('on');
})();
</script></body></html>
